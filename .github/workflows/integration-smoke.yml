name: Integration Smoke

on:
  pull_request:
    paths:
      - "bin/**"
      - "bundle/**"
      - "fixtures/frame-shadow-parity/**"
      - "python/**"
      - "tests/**"
      - "scripts/check_integration_smoke.py"
      - "scripts/release_bundle.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/integration-smoke.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/publish.yml"
  push:
    branches:
      - "main"
    paths:
      - "bin/**"
      - "bundle/**"
      - "fixtures/frame-shadow-parity/**"
      - "python/**"
      - "tests/**"
      - "scripts/check_integration_smoke.py"
      - "scripts/release_bundle.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/integration-smoke.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  integration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Run integration smoke
        run: python3 scripts/check_integration_smoke.py

      - name: Run exact reuse score gate
        run: npm run check:clone-score-gate:local
