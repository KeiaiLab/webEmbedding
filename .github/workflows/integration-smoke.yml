name: Integration Smoke

on:
  pull_request:
    paths:
      - "bin/**"
      - "bundle/**"
      - "fixtures/frame-shadow-parity/**"
      - "python/**"
      - "tests/**"
      - "scripts/check_integration_smoke.py"
      - "scripts/release_bundle.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/integration-smoke.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/publish.yml"
  push:
    branches:
      - "main"
    paths:
      - "bin/**"
      - "bundle/**"
      - "fixtures/frame-shadow-parity/**"
      - "python/**"
      - "tests/**"
      - "scripts/check_integration_smoke.py"
      - "scripts/release_bundle.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/integration-smoke.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  integration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Run integration smoke
        run: python3 scripts/check_integration_smoke.py

      - name: Run exact reuse score gate
        run: npm run check:clone-score-gate:local
