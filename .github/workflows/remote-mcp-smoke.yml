name: Remote MCP Smoke

on:
  pull_request:
    paths:
      - "deploy/vercel-mcp/**"
      - "package.json"
      - ".github/workflows/remote-mcp-smoke.yml"
  push:
    branches:
      - "main"
    paths:
      - "deploy/vercel-mcp/**"
      - "package.json"
      - ".github/workflows/remote-mcp-smoke.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Run remote MCP unit tests
        run: npm --prefix deploy/vercel-mcp test

      - name: Run remote MCP smoke
        run: npm run check:remote-mcp:local
