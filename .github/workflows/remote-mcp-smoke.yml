name: Remote MCP Smoke

on:
  pull_request:
    paths:
      - "deploy/vercel-mcp/**"
      - "package.json"
      - ".github/workflows/remote-mcp-smoke.yml"
  push:
    branches:
      - "main"
    paths:
      - "deploy/vercel-mcp/**"
      - "package.json"
      - ".github/workflows/remote-mcp-smoke.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Run remote MCP unit tests
        run: npm --prefix deploy/vercel-mcp test

      - name: Run remote MCP smoke
        run: npm run check:remote-mcp:local
